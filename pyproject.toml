[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vvm"
version = "0.1.0"
description = "Discover and match Python virtual environments to a project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gszpura", email = "g.szpura@gmail.com" }]
keywords = ["venv", "virtualenv", "virtualenvwrapper", "tooling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vvm = "vvm.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/vvm"

[tool.hatch.build.targets.wheel]
packages = ["src/vvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
